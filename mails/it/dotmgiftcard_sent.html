<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift card consegnata</title></head>
<body style="margin:0;padding:0;background:#F4F4F4;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222222;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F4F4;"><tr><td align="center" style="padding:24px 12px;">
<table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#FFFFFF;border-radius:12px;overflow:hidden;">
<tr><td style="padding:24px 28px;border-bottom:1px solid #E5E5E5;"><a href="{shop_url}" style="text-decoration:none;"><img src="{shop_logo}" alt="{shop_name}" style="max-height:60px;border:0;"></a></td></tr>
<tr><td style="padding:28px 28px 8px;">
<h1 style="margin:0 0 14px;font-size:22px;line-height:1.25;color:{gc_color};">Gift card consegnata</h1>
<p style="margin:0 0 20px;">Ciao {gc_buyer_html},<br>la gift card da <strong>{gc_amount}</strong> per {gc_recipient_html} è stata inviata a <strong>{gc_recipient_email}</strong>.</p>
<p style="margin:0 0 18px;font-size:14px;color:#666666;">Codice: <span style="font-family:'Courier New',Courier,monospace;">{gc_code}</span> · {gc_expire}</p>
<table cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 18px;"><tr><td style="border-radius:10px;background:{gc_color};"><a href="{gc_shop_link}" style="display:inline-block;padding:13px 24px;color:#FFFFFF;font-weight:bold;text-decoration:none;">Vai al negozio</a></td></tr></table>
<p style="margin:0 0 10px;font-size:14px;color:#444444;">Ti scriviamo solo per conferma: non devi fare nulla.</p>
<p style="margin:0;font-size:13px;"><a href="{gc_balance_url}" style="color:{gc_color};">Verifica saldo e scadenza</a></p>
</td></tr>
<tr><td style="padding:20px 28px 28px;color:#666666;font-size:13px;"><a href="{shop_url}" style="color:{gc_color};font-weight:bold;text-decoration:none;">{shop_name}</a></td></tr>
</table></td></tr></table></body></html>
